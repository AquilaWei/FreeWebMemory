<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Saver</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 12px; min-width: 260px; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      h2 { font-size: 14px; margin: 12px 0 4px; }
      dl { margin: 8px 0; }
      dt { color: #555; }
      dd { margin: 0 0 6px; font-weight: 600; }
      button { display: block; width: 100%; margin: 6px 0; padding: 6px; }
      input[type=number] { width: 5em; }
      #tab-list { list-style: none; margin: 4px 0; padding: 0; max-height: 220px; overflow-y: auto; }
      #tab-list li { display: flex; gap: 6px; align-items: center; margin: 2px 0; }
      #tab-list .tab-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #tab-list button { width: auto; margin: 0; padding: 2px 8px; }
      #status { min-height: 1.2em; color: #555; }
    </style>
  </head>
  <body>
    <main>
      <h1>Memory Saver</h1>
      <label><input type="checkbox" id="enabled" /> Discard idle tabs automatically</label>
      <label>Discard after idle minutes (1-1440)
        <input type="number" id="idle-minutes" min="1" max="1440" step="1" />
      </label>
      <dl aria-label="Statistics">
        <dt>Tabs discarded</dt>
        <dd id="discarded-count">0</dd>
        <dt>Memory saved (estimate)</dt>
        <dd id="saved-estimate">0 MB</dd>
        <dt>System memory available</dt>
        <dd id="system-memory">unknown</dd>
      </dl>
      <button type="button" id="discard-now">Discard other tabs now</button>
      <h2 id="tabs-heading">Freeze a single tab</h2>
      <ul id="tab-list" aria-labelledby="tabs-heading"></ul>
      <button type="button" id="never-discard">Never discard this site</button>
      <button type="button" id="reset-stats">Reset statistics</button>
      <button type="button" id="open-options">More settings</button>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
