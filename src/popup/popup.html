<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FreeWebMemory</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      body { width: 340px; }
      /* minmax(0, 1fr): long tab titles must ellipsize instead of widening the popup */
      main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 14px; }
      .setting { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); color: var(--muted); }
      .toggle-row { font-weight: 600; cursor: pointer; }

      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; }
      .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
      .stat dt { color: var(--muted); font-size: 11px; }
      .stat dd { margin: 2px 0 0; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .stat.wide { grid-column: 1 / -1; }
      .stat.wide dd { font-size: 13px; font-weight: 600; }
      #saved-estimate { background: linear-gradient(135deg, var(--brand-2), var(--brand)); -webkit-background-clip: text; background-clip: text; color: transparent; }
      meter { display: block; width: 100%; height: 6px; margin-top: 8px; appearance: none; }
      meter::-webkit-meter-bar { background: var(--surface-2); border: none; border-radius: 999px; height: 6px; }
      meter::-webkit-meter-optimum-value { background: linear-gradient(90deg, var(--brand-2), var(--brand)); border-radius: 999px; }
      meter::-webkit-meter-suboptimum-value { background: var(--danger); border-radius: 999px; }
      meter[hidden] { display: none; }

      .tabs-card { padding: 10px 6px 6px 12px; }
      .tabs-card .section-title { margin-bottom: 4px; }
      #tab-list { list-style: none; margin: 0; padding: 0 6px 0 0; max-height: 196px; overflow-y: auto; }
      #tab-list li { display: flex; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); }
      #tab-list li:last-child { border-bottom: none; }
      #tab-list .tab-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #tab-list button { flex: none; padding: 3px 10px; font-size: 12px; }
      #tab-list button:not(:disabled) { background: var(--brand-soft); border-color: transparent; color: var(--brand); }

      #discard-now, #never-discard { width: 100%; }
      footer { display: flex; justify-content: space-between; }
    </style>
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="icons/icon-32.png" alt="" />
        <div>
          <h1>FreeWebMemory</h1>
          <p>Frees memory held by idle tabs</p>
        </div>
      </header>

      <section class="card">
        <label class="toggle-row">Discard idle tabs automatically
          <input type="checkbox" class="switch" id="enabled" />
        </label>
        <label class="setting">Discard after idle minutes (1-1440)
          <input type="number" id="idle-minutes" min="1" max="1440" step="1" />
        </label>
      </section>

      <dl class="stats" aria-label="Statistics">
        <div class="stat">
          <dt>Tabs discarded</dt>
          <dd id="discarded-count">0</dd>
        </div>
        <div class="stat">
          <dt>Memory saved (estimate)</dt>
          <dd id="saved-estimate">0 MB</dd>
        </div>
        <div class="stat wide">
          <dt>System memory available</dt>
          <dd id="system-memory">unknown</dd>
          <meter id="memory-meter" min="0" max="1" low="0.15" optimum="1" aria-label="Share of system memory available" hidden></meter>
        </div>
      </dl>

      <button type="button" class="primary" id="discard-now">Discard other tabs now</button>

      <section class="card tabs-card">
        <h2 class="section-title" id="tabs-heading">Freeze a single tab</h2>
        <ul id="tab-list" aria-labelledby="tabs-heading"></ul>
      </section>

      <button type="button" id="never-discard">Never discard this site</button>

      <footer>
        <button type="button" class="link" id="reset-stats">Reset statistics</button>
        <button type="button" class="link" id="open-options">More settings</button>
      </footer>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
